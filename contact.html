<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Deluxe X</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#0a0a0a;
--card:rgba(255,255,255,.06);
--line:rgba(255,255,255,.08);
--text:#f6f2e9;
--muted:#b7ae9a;
--gold:#d4a85f;
--gold2:#f0cf96;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Inter,sans-serif;
background:radial-gradient(circle at 20% 10%,rgba(212,168,95,.12),transparent 40%),var(--bg);
color:var(--text);
}
header{
position:sticky;
top:0;
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 6vw;
background:rgba(10,10,10,.7);
backdrop-filter:blur(14px);
border-bottom:1px solid var(--line);
}
.logo{
font-family:Playfair Display,serif;
font-size:26px;
}
nav a{
color:var(--text);
text-decoration:none;
margin-left:18px;
font-size:14px;
opacity:.8;
}
nav a:hover{color:var(--gold)}
.hero{
text-align:center;
padding:90px 20px 40px;
}
.hero h1{
font-family:Playfair Display,serif;
font-size:clamp(2.5rem,6vw,4.5rem);
}
.hero p{
color:var(--muted);
margin-top:10px;
}
.container{
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
padding:60px 6vw 100px;
}
.card{
background:var(--card);
border:1px solid var(--line);
border-radius:26px;
padding:26px;
backdrop-filter:blur(12px);
}
.input{
width:100%;
padding:14px;
margin-bottom:14px;
border-radius:14px;
border:1px solid var(--line);
background:#0d0d0d;
color:#fff;
outline:none;
}
textarea{
width:100%;
padding:14px;
border-radius:14px;
border:1px solid var(--line);
background:#0d0d0d;
color:#fff;
resize:none;
outline:none;
margin-bottom:14px;
}
button{
width:100%;
padding:14px;
border:none;
border-radius:999px;
cursor:pointer;
font-weight:600;
background:linear-gradient(135deg,var(--gold),var(--gold2));
color:#111;
transition:.3s;
}
button:hover{transform:translateY(-3px)}
.info h3{
margin-bottom:10px;
}
.info p{
color:var(--muted);
line-height:1.7;
margin-bottom:12px;
}
.map{
height:220px;
border-radius:18px;
background:url('https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&w=1200&q=80') center/cover;
border:1px solid var(--line);
margin-top:14px;
}
@media(max-width:900px){
.container{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
<div class="logo">Deluxe X</div>
<nav>
<a href="index.html">Home</a>
<a href="menu.html">Menu</a>
<a href="reserve.html">Reserve</a>
</nav>
</header>

<section class="hero">
<h1>Contact Us</h1>
<p>We are here to assist you with reservations, events, and inquiries.</p>
</section>

<section class="container">

<div class="card">
<input type="text" placeholder="Your Name" class="input">
<input type="email" placeholder="Email" class="input">
<textarea rows="5" placeholder="Your Message"></textarea>
<button>Send Message</button>
</div>

<div class="card info">
<h3>Restaurant Info</h3>
<p>📍 Tbilisi, Georgia</p>
<p>📞 +995 555 123 456</p>
<p>✉️ info@deluxex.com</p>

<div class="map"></div>
</div>

</section>

</body>
</html>
